name: Weekly Hub Metrics Aggregation

# Re-bakes the org-wide live stats strip, per-member metric pills, and the
# combined "Latest work" feed into index.html. Runs every Monday at 06:00 UTC
# — one hour after each member's serpapi-weekly.yml workflow finishes at
# 05:00 UTC, so member data is fresh when the hub pulls from it.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aggregate live metrics from member sites
        # No external API keys needed — every member repo is public and the
        # script pulls data/serpapi/{metrics,serpapi}.json straight from
        # raw.githubusercontent.com.
        run: |
          set -euo pipefail
          python aggregate_metrics.py

      - name: Commit baked changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: refresh org-wide live metrics + latest feed'
          file_pattern: 'index.html'
