<style>
:root {
    --bg: #0b0e16; --card: #121726; --border: #212940;
    --text: #e9ecf5; --text-soft: #a6aec2; --muted: #6f7a94;
    --c1: #5e9eff; --c2: #8b88e8; --c3: #f48fb1; --c4: #e8a85c;
    --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
    --body: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --eo: cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: light) {
    :root { --bg: #f5f6fa; --card: #ffffff; --border: #dce0eb;
            --text: #141927; --text-soft: #454d61; --muted: #6a7288;
            --c1: #1e56c8; --c2: #4338ca; --c3: #c2185b; --c4: #a86411; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg); color: var(--text); font-family: var(--body);
    min-height: 100dvh; display: grid; place-items: center;
    text-align: center; padding: 2rem;
}
.glyph { margin-bottom: 1.4rem; }
.code {
    font-family: var(--display);
    font-size: clamp(5.5rem, 17vw, 11rem);
    font-weight: 600; line-height: 1; letter-spacing: -0.04em;
    background: linear-gradient(92deg, var(--c1), var(--c2) 36%, var(--c3) 68%, var(--c4));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--c2);
    margin-bottom: 0.6rem;
}
.title {
    font-family: var(--display);
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.8rem;
}
.msg { color: var(--text-soft); max-width: 46ch; margin: 0 auto 2rem; line-height: 1.6; }
.actions { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
.actions a {
    padding: 0.62rem 1.25rem; border: 1px solid var(--border); border-radius: 999px;
    color: var(--a, var(--text)); text-decoration: none; font-size: 0.92rem; font-weight: 600;
    transition: transform 0.18s var(--eo), border-color 0.18s var(--eo);
}
.actions a:hover { transform: translateY(-1px); border-color: var(--a, var(--muted)); }
.actions a:active { transform: scale(0.97); transition-duration: 0.1s; }
.actions a.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.actions a.m1 { --a: var(--c1); }
.actions a.m2 { --a: var(--c2); }
.actions a.m3 { --a: var(--c3); }
.actions a.m4 { --a: var(--c4); }
:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
    .in { animation: rise 0.6s var(--eo) both; }
    .in:nth-child(2) { animation-delay: 0.06s; }
    .in:nth-child(3) { animation-delay: 0.12s; }
    .in:nth-child(4) { animation-delay: 0.18s; }
    .in:nth-child(5) { animation-delay: 0.24s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<main>

                <line x1="17" y1="4.5" x2="19" y2="15"/>
                <line x1="19" y1="15" x2="8" y2="19.5"/>
                <line x1="8" y1="19.5" x2="5.5" y2="7.5"/>
            </g>
            <circle cx="5.5" cy="7.5" r="2.1" fill="var(--c1)"/>
            <circle cx="17" cy="4.5" r="2.1" fill="var(--c2)"/>
            <circle cx="19" cy="15" r="2.1" fill="var(--c3)"/>
            <circle cx="8" cy="19.5" r="2.1" fill="var(--c4)"/>
        </svg>
    </p>
    <p class="code in">404</p>
    <h1 class="title in">This page is off the map.</h1>
    <p class="msg in">The link is broken or the page never existed. Head back to the hub, or visit one of the four member sites.</p>

</main>

</html>
